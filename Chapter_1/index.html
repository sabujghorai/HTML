<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIRA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="mira-interface">

        <!-- Speech text area -->
        <div class="speech-area" id="speechArea">

            <div
                id="speechText"
                class="speech-text"
            >
                Listening...
            </div>

        </div>


        <!-- Animated orb -->
        <div class="orb-area">

            <canvas id="orbCanvas"></canvas>

        </div>

    </main>


    <script src="orb.js"></script>
    <script src="script.js"></script>

</body>

</html>
