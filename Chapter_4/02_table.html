<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table - HTML</title>
</head>

<body>
    <h1>Table in HTML</h1>
    <table>
        <!-- head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Height</th>
                <th>Weight</th>
            </tr>
        </thead>
        <!-- body of the table  -->
        <tbody>
            <tr>
                <td>Sabuj Ghorai</td>
                <td>175 cm</td>
                <td>57 kg</td>
            </tr>
            <tr>
                <td>Akash Ghorai</td>
                <td>173 cm</td>
                <td>54 kg</td>
            </tr>
            <tr>
                <td>Debendra Ghorai</td>
                <td>179 cm</td>
                <td>67 kg</td>
            </tr>
            <tr>
                <td>Chameli Ghorai</td>
                <td>165 cm</td>
                <td>49 kg</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
