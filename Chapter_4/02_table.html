<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table - HTML</title>
    <style>
        table {
    width: 80%;
    margin: 20px auto;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

th {
    background-color: #4CAF50;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 12px;
    border: 1px solid #ddd;
    border: color rgb(236, 14, 14);
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

tr:hover {
    background-color: #ddd;
}
    </style>
</head>

<body>
    <h1>Table in HTML</h1>
    <table>
        <!-- head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Height</th>
                <th>Weight</th>
            </tr>
        </thead>
        <!-- body of the table  -->
        <tbody>
            <tr>
                <td>Sabuj Ghorai</td>
                <td>177 cm</td>
                <td>57 kg</td>
            </tr>

            <tr>
                <td>Akash Ghorai</td>
                <td>175 cm</td>
                <td>50 kg</td>
            </tr>

            <tr>
                <td>Debendra Ghorai</td>
                <td>179 cm</td>
                <td>63 kg</td>
            </tr>
            
            <tr>
                <td>Chameli Ghorai</td>
                <td>165 cm</td>
                <td>46 kg</td>
            </tr>
            <tr>
                <td colspan="1"> Thank</td>
                <td colspan="1">You</td>  <!--colsplan ="1" means the you word takes the 1 coloumn -->
                <td colspan="1">All</td> <!-- colspan = "2" means the 'All' word takes the 2 coloumn -->
                
            </tr>
        </tbody>
    </table>
</body>

</html>
