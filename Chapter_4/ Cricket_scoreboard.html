<!-- Create a table displaying score of a cricker players in a match using HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        /* General Page Styling */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
}

/* Heading */
h2 {
    color: #333;
    margin-bottom: 20px;
}

/* Table Styling */
table {
    width: 70%;
    border-collapse: collapse;
    background-color: white;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    overflow: hidden;
}

/* Header */
thead {
    background-color: #007bff;
    color: white;
}

th {
    padding: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Body Cells */
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

/* Alternate Row Colors */
tbody tr:nth-child(even) {
    background-color: #f8f9fa;
}

/* Hover Effect */
tbody tr:hover {
    background-color: #e9f3ff;
    transition: 0.3s;
}

/* Last Row Border Removal */
tbody tr:last-child td {
    border-bottom: none;
}
    </style>
</head>
<body>
    <table>
        <h2>Table for players performence</h2>
        <thead>
            <tr>
                <th>name</th>
                <th>Score</th>
                <th>Match</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Rohit Sharma</td>
                <td>418</td>
                <td>IPL 2025</td>
            </tr>
            <tr>
                <td>Virat Kholi</td>
                <td>657</td>
                <td>IPL 2025</td>
            </tr>
            <tr>
                <td>Vaibhav Sooryabansi</td>
                <td>776</td>
                <td>IPL 2025</td>
            </tr>
            
        </tbody>
    </table>
</body>
</html>
