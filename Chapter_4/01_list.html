<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in html</title>
</head>

<body>
    <h1>List in HTML</h1>

    <h2>Steps to bake a cake</h2>

    <!-- order list -->
    <ol>

        <li> 1½ cups (190 g) all-purpose flour</li>
        <li> 1 cup (200 g) sugar</li>
        <li> ½ cup (115 g) butter, softened</li>
        <li> 2 eggs</li>
        <li> ½ cup (120 ml) milk</li>
        <li> 1½ tsp baking powder</li>
        <li> 1 tsp vanilla extract</li>
        <li> A pinch of salt</li>

    </ol>

    <ul>
        <li>Milk</li>
        <li>Bread</li>
        <li>Egg</li>
        <li>Butter</li>
        <li>vegetables</li>
    </ul>

</body>

</html>
