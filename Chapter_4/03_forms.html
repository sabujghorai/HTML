<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - HTML</title>
</head>

<body>
    <h1>forms in HTML</h1>
    <form action="/submit.php" target="_blank">

        <!-- Name input  -->
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Name"
             required>
        </div>

        <!-- phone number input  -->
        <div>
            <label for="Phone">Phone</label>
            <input id="Phone" type="tel" placeholder="Enter phone " 
            required>
        </div>

        <!-- Email input  -->
         <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter email" 
            required>
        </div>

        <!-- Password input  -->
        <div>
            <label for="pass">Password</label>
            <input id="pass" type="password" placeholder="Enter Password " 
            required>
        </div>

        <!-- Date input  -->
         <div>
            <label for="dob">Enter Date of Birth</label>
            <input id="dob" type="date" required>
         </div>

         <!-- select Dropdown -->
          <div>
            <label for="gender">Gender</label>
            <select name="gender" id=""required>
                <option value="" disable selected="select Gender"></option>

                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
          </div>

        <!-- Radio button for subscription -->
         <h3>Subcription plan for Netflix</h3>
         <input id="basic" type="radio" name="subscription" value="basic">
         <label for="basic">Basic</label>

         <input id="premium" type="radio" name="subscription" value="premium">
         <label for="premium">Premium</label>

         <input id="VIP" type="radio" name="subscription" value="VIP">
         <label for="VIP">VIP</label>
         
         <input id="button" type="button" value="button">
         <label for="button"></label>

         <!-- checkbox for agreeing to term -->
          <div>
              <input id="term" type="checkbox" required>
              <label for="term">I agree to the term and condition</label>
          </div>

          <!-- Text area for comment -->
           <div>
            <h3>Comment</h3>
            <label for="comment"></label>
            <textarea id="comment" placeholder="Enter your comment" rows="4" ></textarea>
           </div>

           <!-- submit button in HTML  -->
            <div>
                <button type="submit">Submit</button>
            </div>

    </form>
</body>

</html>
