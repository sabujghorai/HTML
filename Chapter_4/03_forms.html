<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - HTML</title>
    <style>
        /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Styling */
body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    display: flex;
    justify-content: center;
    padding: 40px;
}

/* Form Container */
form {
    background: white;
    padding: 30px;
    width: 450px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

/* Heading */
h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

/* Form Groups */
div {
    margin-bottom: 15px;
}

/* Labels */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
}

/* Inputs, Select, Textarea */
input[type="text"],
input[type="tel"],
input[type="email"],
input[type="password"],
input[type="date"],
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

/* Focus Effect */
input:focus,
select:focus,
textarea:focus {
    border-color: #4a90e2;
    box-shadow: 0 0 5px rgba(74, 144, 226, 0.4);
}

/* Radio Buttons Section */
h3 {
    margin: 15px 0 10px;
    color: #333;
}

input[type="radio"] {
    margin-right: 5px;
}

input[type="radio"] + label {
    display: inline;
    margin-right: 15px;
    font-weight: normal;
}

/* Checkbox */
input[type="checkbox"] {
    margin-right: 8px;
}

/* Button */
button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button[type="submit"]:hover {
    background: #357abd;
}

/* Textarea */
textarea {
    resize: vertical;
}
    </style>
</head>

<body>
    <h1>forms in HTML</h1>
    <form action="/submit.php" target="_blank">

        <!-- Name input  -->
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Name"
             required>
        </div>

        <!-- phone number input  -->
        <div>
            <label for="Phone">Phone</label>
            <input id="Phone" type="tel" placeholder="Enter phone " 
            required>
        </div>

        <!-- Email input  -->
         <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter email" 
            required>
        </div>

        <!-- Password input  -->
        <div>
            <label for="pass">Password</label>
            <input id="pass" type="password" placeholder="Enter Password " 
            required>
        </div>

        <!-- Date input  -->
         <div>
            <label for="dob">Enter Date of Birth</label>
            <input id="dob" type="date" required>
         </div>

         <!-- select Dropdown -->
          <div>
            <label for="gender">Gender</label>
            <select name="gender" id=""required>
                <option value="" disable selected="select Gender"></option>

                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
          </div>

        <!-- Radio button for subscription -->
         <h3>Subcription plan for Netflix</h3>
         <input id="basic" type="radio" name="subscription" value="basic">
         <label for="basic">Basic</label>

         <input id="premium" type="radio" name="subscription" value="premium">
         <label for="premium">Premium</label>

         <input id="VIP" type="radio" name="subscription" value="VIP">
         <label for="VIP">VIP</label>
         
         <input id="button" type="button" value="button">
         <label for="button"></label>

         <!-- checkbox for agreeing to term -->
          <div>
              <input id="term" type="checkbox" required>
              <label for="term">I agree to the term and condition</label>
          </div>

          <!-- Text area for comment -->
           <div>
            <h3>Comment</h3>
            <label for="comment"></label>
            <textarea id="comment" placeholder="Enter your comment" rows="4" ></textarea>
           </div>

           <!-- submit button in HTML  -->
            <div>
                <button type="submit">Submit</button>
            </div>

    </form>
</body>

</html>
