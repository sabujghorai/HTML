<!-- Create an HTML form for travel website to book a vacation -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel Agency - Book your travel to kolkata</title>
</head>
<body>
    <form action="">
        <div>
            <label for="name ">Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="Age">Age</label>
            <input id="Age" type="number" placeholder="Enter your age">
        </div>

        <div>
            <label for="phonenumber">Phone</label>
            <input id="phonenumber" type="phone" placeholder="Enter your Phone number">
        </div>

        <div>
            <label for="email">Email Id</label>
            <input id="email" type="email" placeholder="Enter your Email Id">
        </div>

    </form>
</body>
</html>
