<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>

        <ul>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" width="150">
            <div>
                <label for="language"></label>

                <select name="language" id="" required>
                    <option value="English" disabled selected>English</option>

                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Bengali">Bengali</option>
                </select>

                <a href="">Sign In</a>
            </div>

            <h1>Unlimited movies, shows, and more</h1>
            <p>
                <h3>Starts at ₹149. Cancel at any time.</h3>
                <h4>Ready to watch? Enter your email to create or restart your membership.</h4>
            </p>
            <label for="email"></label>
            <input id="email" type="email" placeholder="Email Adress">
            <button>Get Started &gt;</button>
        </ul>
    </header>
    <main> </main>
    <footer></footer>

    <script src="js/script.js"></script>
</body>

</html>
