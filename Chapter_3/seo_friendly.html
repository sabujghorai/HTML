<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zomato - food delivery at your doorstep</title>
    <style>
        /* Reset default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            color: red;
            background-color: #fff;
            text-align: center;
        }

        /* Header */
        header {
            background-color: #ffe5e5;
            padding: 20px;
        }

        header div:first-child {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Navigation links */
        a {
            color: red;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Main section */
        main {
            padding: 40px 20px;
        }

        main div {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        pre {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        /* Footer */
        footer {
            background-color: #ffe5e5;
            padding: 15px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            zomato
        </div>
        <div>
            <a href="/home" target="_blank">Home</a>
            <br>
            <a href="/about" target="_blank">About</a>
            <br>
            <a href="/contact" target="_blank">Contact</a>
        </div>
    </header>
    <main>
        <div>
            Order anytime , anywhere
        </div>
        <pre>
For over a decade, 
we’ve enabled our customers to discover new tastes, 
delivered right to their doorstep
        </pre>
    </main>

    <footer>
        Copyright zomato all all rights reserved
        <footer>
</body>

</html>
