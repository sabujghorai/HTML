<!DOCTYPE html>
<html lang="en">
<head>

    <title>Netflix - Get Started</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#141414;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            text-align:center;
            background:rgba(0,0,0,.8);
            padding:50px;
            border-radius:8px;
            width:500px;
        }

        h1{
            margin-bottom:20px;
        }

        p{
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
            background:#e50914;

            border-radius:4px;
        }

        a:hover{
            background:#c11119;
        }

    <div class="container">
        <h1>Welcome to Netflix</h1>

        <p>
